# filepath: .github/workflows/daily_tracker.yml
name: Daily Exam Tracker

on:
  schedule:
    - cron: '0 2 * * *' # Runs every day at 02:00 UTC (07:30 AM IST)
  workflow_dispatch: # Allows you to trigger it manually from GitHub

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install chromium --with-deps

      - name: Run test validation suite
        run: |
          pytest -v

      - name: Run Scraper & Sync to Notion
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          gov-exam-scraper scrape --sync-notion --output exams.json

      - name: Upload Scraped JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-scraped-exams
          path: exams.json
          retention-days: 7