name: Daily Exam Tracker & Notion Sync

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      # Step 1: Syncs vacancies to Notion quietly (no Telegram/Discord spam)
      - name: Step 1 - Sync General Vacancies to Notion
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: gov-exam-scraper scrape --sync-notion --archive-expired

      # Step 2: Checks official commission portals for your 11 applied exams
      - name: Step 2 - Track Applied Exams, Dates & Admit Cards
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_APPLIED_DB_ID: ${{ secrets.NOTION_APPLIED_DB_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/gov_exam_scraper/track_applied.py

      # Step 3: Targeted aggregator monitor (strictly for your 11 exams: dates, syllabus, notes, results)
      - name: Step 3 - Targeted Applied Exam Aggregator Watcher
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/gov_exam_scraper/aggregators.py

      # Step 4: Persist alert cache so duplicate alerts are never resent
      - name: Step 4 - Commit Alert History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sent_alerts.json || true
          git commit -m "chore: record sent alert history [skip ci]" || true
          git push origin main || true
