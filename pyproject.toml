[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gov-exam-scraper"
version = "0.1.0"
description = "Production-grade government exam tracker & Notion sync engine using Groq LLaMA-3.1"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abhijith K M", email = "abhijith.1si17ei002@gmail.com" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "groq>=0.9.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.44.0",
    "cachetools>=5.3.3",
    "tenacity>=8.3.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "types-requests>=2.31.0.20240406",
    "types-beautifulsoup4>=4.12.0.20240511",
    "types-cachetools>=5.3.0.7",
]

[project.scripts]
gov-exam-scraper = "gov_exam_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gov_exam_scraper"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]